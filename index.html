<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>대전대흥교회 청소년부</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/index.css">
    <style>
        /* 👑 관리자 탑바 최상단 완전 고정 및 레이어 설정 */
        .admin-only-bar {
            position: fixed;   
            top: 0;
            left: 0;
            width: 100%;
            height: 40px;      
            box-sizing: border-box;
            z-index: 10001;    
            background-color: #1d1d1f;
            color: #ffffff;
            padding: 0 20px;
            display: none;     
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 500;
            border-bottom: 2px solid #0062ff;
        }
        .admin-only-bar .admin-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            color: #0062ff;
        }
        .admin-only-bar .admin-btn-group {
            display: flex;
            gap: 10px;
        }
        .admin-only-bar a {
            color: #fff;
            text-decoration: none;
            background: #333;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            transition: background 0.2s;
        }
        .admin-only-bar a:hover {
            background: #0062ff;
        }

        /* 👑 관리자 바 활성화 시 본문 밀어내기 */
        body.admin-mode-active {
            padding-top: 40px !important; 
        }
        body.admin-mode-active nav {
            top: 40px !important; 
        }
        nav {
            transition: top 0.3s ease-out; 
        }

        /* 👑 대시보드 수정 모달창 고급 CSS 스타일링 */
        .admin-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 20000;
            display: none; 
            justify-content: center;
            align-items: center;
        }
        .admin-modal-box {
            background: #fff;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            font-family: 'Noto Sans KR', sans-serif;
            animation: modalFadeUp 0.3s ease-out;
        }
        .admin-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .admin-modal-header h3 {
            margin: 0; font-size: 1.3rem; color: #111; font-weight: 700;
        }
        .admin-modal-close {
            background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #aaa;
        }
        .admin-modal-close:hover { color: #000; }
        
        .admin-form-group {
            margin-bottom: 16px;
        }
        .admin-form-group label {
            display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; color: #444;
        }
        .admin-form-group input[type="text"],
        .admin-form-group input[type="file"],
        .admin-form-group textarea {
            width: 100%; box-sizing: border-box; padding: 10px;
            border: 1px solid #ccc; border-radius: 8px; font-size: 0.9rem; font-family: inherit;
        }
        .admin-form-group textarea { height: 70px; resize: vertical; }
        .admin-form-group input:focus, .admin-form-group textarea:focus {
            border-color: #0062ff; outline: none; box-shadow: 0 0 4px rgba(0,98,255,0.2);
        }
        
        /* 파일 헬퍼 텍스트 스타일 */
        .admin-form-group .file-helper {
            font-size: 0.8rem; color: #666; margin-top: 4px; display: block;
        }

        .admin-modal-footer {
            display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px;
            border-top: 1px solid #eee; padding-top: 15px;
        }
        .admin-btn {
            padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer;
        }
        .admin-btn-save { background: #0062ff; color: #fff; }
        .admin-btn-save:hover { background: #004bca; }
        .admin-btn-cancel { background: #eee; color: #555; }
        .admin-btn-cancel:hover { background: #ddd; }

        @keyframes modalFadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div id="admin-top-bar" class="admin-only-bar">
    <span class="admin-title">🛠️ 청소년부 관리자 모드 활성화됨</span>
    <div class="admin-btn-group">
        <a href="#" id="edit-main-btn" style="background:#0062ff;">✏️ 메인 내용 수정하기</a>
        <a href="notice_write.html">📢 공지 작성</a>
        <a href="sermon_manage.html">📖 공과/설교 관리</a>
    </div>
</div>

        </div>
        <form id="admin-content-form">

            <div class="admin-form-group">

            <div class="admin-form-group">

                <textarea id="form-box4-text" required></textarea>
            </div>
            <div class="admin-form-group">

                <span class="file-helper">💡 사진을 새로 바꾸실 때만 파일을 선택해 주세요. (미선택 시 기존 사진 유지)</span>
            </div>
            <div class="admin-modal-footer">
                <button type="button" class="admin-btn
