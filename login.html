<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>로그인 | 대전대흥교회 청소년부</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0062ff;
            --primary-blue-dark: #004dc7;
            --text-dark: #1d1d1f;
            --text-gray: #86868b;
            --border-color: #d2d2d7;
            --bg-gray: #f2f2f7; /* 터치 시 피드백을 위한 애플 규격 그레이 코드 */
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: var(--text-dark);
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh; 
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }

        .container { 
            width: 100%; 
            max-width: 360px; 
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header { text-align: center; margin-bottom: 45px; }
        header h1 { font-size: 2rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 12px; color: var(--primary-blue); }
        /* [변경] 한 줄로 이어지며 단정한 마침표로 끝나는 환영 멘트 */
        header p { font-size: 0.95rem; color: var(--text-gray); font-weight: 500; }

        .login-form { display: flex; flex-direction: column; gap: 22px; }
        .field { display: flex; flex-direction: column; gap: 8px; }
        
        .password-wrapper { position: relative; width: 100%; }
        
        label { font-size: 0.9rem; font-weight: 800; position: relative; padding-left: 14px; color: #333; }
        label::before {
            content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            width: 4px; height: 14px; background-color: var(--primary-blue); border-radius: 2px;
        }

        input {
            width: 100%; 
            padding: 16px; 
            border: 1px solid var(--border-color);
            border-radius: 12px; 
            font-size: 1rem; 
            background-color: #fff;
            transition: var(--transition); 
            outline: none;
            -webkit-appearance: none;
        }
        
        input:focus { 
            border-color: var(--primary-blue); 
            box-shadow: 0 0 0 4px rgba(0, 98, 255, 0.1); 
        }
        
        #password { padding-right: 52px; }

        .toggle-password {
            position: absolute; 
            right: 6px; 
            top: 50%; 
            transform: translateY(-50%);
            background: none; 
            border: none; 
            cursor: pointer;
            width: 44px;
            height: 44px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            user-select: none;
        }
        .toggle-password svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--text-gray);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: var(--transition);
        }
        .toggle-password #eye-slash {
            stroke: var(--text-gray);
            stroke-width: 2;
        }
        .toggle-password.active svg {
            stroke: var(--primary-blue);
        }
        .toggle-password.active #eye-slash {
            stroke: var(--primary-blue);
        }

        .login-btn {
            width: 100%;
            padding: 18px; 
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-blue-dark) 100%);
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 1.1rem;
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 10px; 
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(0, 98, 255, 0.2);
            -webkit-appearance: none;
        }
        .login-btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 98, 255, 0.3);
        }
        .login-btn:active { 
            transform: scale(0.98); 
            box-shadow: 0 2px 6px rgba(0, 98, 255, 0.15); 
        }

        .nav-links { text-align: center; margin-top: 25px; display: flex; justify-content: center; align-items: center; gap: 12px; }
        .nav-links a { color: var(--text-gray); text-decoration: none; font-size: 0.85rem; font-weight: 500; padding: 6px 12px; border-radius: 8px; transition: var(--transition); }
        
        /* [복구] 하단 링크 메뉴들의 원본 마우스 호버 및 모바일 터치 액션 효과 */
        .nav-links a:hover { 
            background-color: var(--bg-gray); 
            color: var(--primary-blue); 
        }
        .nav-links a:active {
            transform: scale(0.97);
        }
        .divider { width: 1px; height: 10px; background-color: var(--border-color); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>대전대흥교회 청소년부</h1>
            <!-- [변경] <br> 제거, ! 대신 . 마침표 적용 완료 -->
            <p>청소년부 홈페이지에 오신 것을 환영합니다. 서비스 이용을 위해 로그인을 해주세요.</p>
        </header>

        <div class="login-form">
            <div class="field">
                <label for="email">ID</label>
                <input type="email" id="email" placeholder="아이디를 입력해주세요" required autocomplete="username" inputmode="email">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="비밀번호를 입력해주세요" required autocomplete="current-password">
                    <button type="button" id="toggle-password" class="toggle-password" title="비밀번호 보기">
                        <svg id="eye-icon" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                            <line id="eye-slash" x1="4" y1="4" x2="20" y2="20" style="display:none;"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <button id="login-btn" class="login-btn">로그인</button>

            <div class="nav-links">
                <a href="signup.html">회원가입 </a>
                <span class="divider"></span>
                <a href="index.html">홈페이지로 돌아가기</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAp8majwjPetRnK5u9f_agOWEcW2_veBdw",
            authDomain: "dhchurch-cf85f.firebaseapp.com",
            projectId: "dhchurch-cf85f",
            storageBucket: "dhchurch-cf85f.firebasestorage.app",
            messagingSenderId: "718998916531",
            appId: "1:718998916531:web:6d5641ed5a404c2ee0cfc6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if(!email || !password) {
                alert("아이디와 비밀번호를 모두 입력해주세요.");
                return;
            }

            try {
                await setPersistence(auth, browserSessionPersistence);
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                const userDocRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userDocRef);

                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    if (userData.role === 'admin') {
                        sessionStorage.setItem('isAdmin', 'true');
                        alert("관리자님, 환영합니다!");
                    } else {
                        sessionStorage.removeItem('isAdmin');
                        alert("로그인되었습니다.");
                    }
                } else {
                    sessionStorage.removeItem('isAdmin');
                    alert("로그인되었습니다.");
                }

                window.location.href = "index.html"; 
            } catch(e) {
                alert("로그인 실패: 이메일 또는 비밀번호를 확인해주세요.");
                console.error(e.message);
            }
        }

        document.getElementById('login-btn').addEventListener('click', handleLogin);

        document.getElementById('email').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
        document.getElementById('password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('toggle-password');
        const eyeSlash = document.getElementById('eye-slash');

        togglePasswordBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePasswordBtn.classList.add('active');
                eyeSlash.style.display = 'block';
                togglePasswordBtn.setAttribute('title', '비밀번호 숨기기');
            } else {
                passwordInput.type = 'password';
                togglePasswordBtn.classList.remove('active');
                eyeSlash.style.display = 'none';
                togglePasswordBtn.setAttribute('title', '비밀번호 보기');
            }
        });
    </script>
</body>
</html>
