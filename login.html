<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 크기 최적화 및 자동 확대 방지 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>로그인 | 대전대흥교회 청소년부</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0062ff;
            --primary-blue-dark: #004dc7;
            --text-dark: #1d1d1f;
            --text-gray: #86868b;
            --border-color: #d2d2d7;
            --bg-gray: #f5f5f7;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: var(--text-dark);
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh; 
            /* 모바일 하단 노치/인디케이터 여백 확보 */
            padding: 20px padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }

        .container { 
            width: 100%; 
            max-width: 360px; /* 조금 더 트렌디하고 컴팩트한 폭 조정 */
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header { text-align: center; margin-bottom: 40px; }
        header h1 { font-size: 1.8rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 10px; color: var(--primary-blue); }
        header p { font-size: 0.9rem; color: var(--text-gray); font-weight: 500; }

        .login-form { display: flex; flex-direction: column; gap: 18px; }
        .field { display: flex; flex-direction: column; gap: 8px; }
        
        /* 비밀번호 눈 아이콘 배치를 위한 부모 요소 고정 */
        .password-wrapper { position: relative; width: 100%; }
        
        label { font-size: 0.85rem; font-weight: 700; position: relative; padding-left: 12px; color: #333; }
        label::before {
            content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            width: 3px; height: 12px; background-color: var(--primary-blue); border-radius: 2px;
        }

        input {
            width: 100%; 
            padding: 16px; 
            border: 1px solid var(--border-color);
            border-radius: 12px; 
            font-size: 1rem; 
            background-color: #fff;
            transition: var(--transition); 
            outline: none;
            /* iOS 기기에서 input 안쪽 기본 그림자 제거 및 모서리 둥글기 고정 */
            -webkit-appearance: none;
        }
        
        /* 모바일 터치 피드백 강화 및 테두리 변화 */
        input:focus { border-color: var(--primary-blue); background-color: #fff; box-shadow: 0 0 0 4px rgba(0, 98, 255, 0.08); }
        
        /* 모바일 가독성을 위해 글자가 눈 아이콘에 가려지지 않도록 우측 패딩 충분히 확보 */
        #password { padding-right: 52px; }

        /* [변경] 현대적인 눈 아이콘 버튼 스타일 */
        .toggle-password {
            position: absolute; 
            right: 4px; 
            top: 50%; 
            transform: translateY(-50%);
            background: none; 
            border: none; 
            cursor: pointer;
            width: 44px; /* 모바일 최소 터치 영역 확보 */
            height: 44px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            user-select: none; 
            transition: var(--transition);
        }
        .toggle-password svg {
            width: 20px;
            height: 20px;
            stroke: var(--text-gray);
            fill: none;
            transition: var(--transition);
        }
        .toggle-password:active svg {
            transform: scale(0.9);
        }
        /* 눈 아이콘 활성화 시 색상 변경 */
        .toggle-password.active svg {
            stroke: var(--primary-blue);
        }

        .login-btn {
            width: 100%;
            padding: 16px; 
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-blue-dark) 100%);
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 1rem;
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 8px; 
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(0, 98, 255, 0.15);
            -webkit-appearance: none;
        }
        /* 모바일에서 버튼 터치하고 있을 때(누르고 있을 때) 반응 효과 */
        .login-btn:active { 
            transform: scale(0.98); 
            box-shadow: 0 2px 6px rgba(0, 98, 255, 0.2); 
        }

        .nav-links { text-align: center; margin-top: 25px; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .nav-links a { color: var(--text-gray); text-decoration: none; font-size: 0.85rem; font-weight: 500; padding: 8px 12px; border-radius: 8px; transition: var(--transition); }
        .nav-links a:active { background-color: var(--bg-gray); color: var(--primary-blue); }
        .divider { width: 1px; height: 10px; background-color: var(--border-color); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>대전대흥교회 청소년부</h1>
            <p>서비스 이용을 위해 로그인을 해주세요</p>
        </header>

        <div class="login-form">
            <div class="field">
                <label for="email">ID</label>
                <!-- 모바일에서 이메일 키패드가 바로 뜨도록 가이드 제공 -->
                <input type="email" id="email" placeholder="아이디(이메일)를 입력해주세요" required autocomplete="username" inputmode="email">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="비밀번호를 입력해주세요" required autocomplete="current-password">
                    <!-- [변경] 이모지 대신 들어간 정밀 가공된 모던 SVG 눈 아이콘 -->
                    <button type="button" id="toggle-password" class="toggle-password" title="비밀번호 보기">
                        <svg id="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <!-- 기본 감겨있는 눈 모양 경로 (기본값) -->
                            <path class="eye-open" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle class="eye-open" cx="12" cy="12" r="3"></circle>
                            <!-- 감은 눈 선 (자바스크립트에서 토글 처리 예정) -->
                            <line class="eye-close" x1="1" y1="1" x2="23" y2="23" style="display:none;"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <button id="login-btn" class="login-btn">로그인</button>

            <div class="nav-links">
                <a href="signup.html">회원가입</a>
                <span class="divider"></span>
                <a href="index.html">홈페이지로 돌아가기</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAp8majwjPetRnK5u9f_agOWEcW2_veBdw",
            authDomain: "dhchurch-cf85f.firebaseapp.com",
            projectId: "dhchurch-cf85f",
            storageBucket: "dhchurch-cf85f.firebasestorage.app",
            messagingSenderId: "718998916531",
            appId: "1:718998916531:web:6d5641ed5a404c2ee0cfc6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if(!email || !password) {
                alert("아이디와 비밀번호를 모두 입력해주세요.");
                return;
            }

            try {
                await setPersistence(auth, browserSessionPersistence);
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                const userDocRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userDocRef);

                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    if (userData.role === 'admin') {
                        sessionStorage.setItem('isAdmin', 'true');
                        alert("관리자님, 환영합니다!");
                    } else {
                        sessionStorage.removeItem('isAdmin');
                        alert("로그인되었습니다.");
                    }
                } else {
                    sessionStorage.removeItem('isAdmin');
                    alert("로그인되었습니다.");
                }

                window.location.href = "index.html"; 
            } catch(e) {
                alert("로그인 실패: 이메일 또는 비밀번호를 확인해주세요.");
                console.error(e.message);
            }
        }

        document.getElementById('login-btn').addEventListener('click', handleLogin);

        document.getElementById('email').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
        document.getElementById('password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        // [변경] SVG 눈 아이콘 전용 토글 자바스크립트 로직
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('toggle-password');
        const eyeCloseLine = togglePasswordBtn.querySelector('.eye-close');

        togglePasswordBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePasswordBtn.classList.add('active');
                eyeCloseLine.style.display = 'block'; // 패스워드가 보일 때 사선(\)을 그어 숨기기 상태 유도
                togglePasswordBtn.setAttribute('title', '비밀번호 숨기기');
            } else {
                passwordInput.type = 'password';
                togglePasswordBtn.classList.remove('active');
                eyeCloseLine.style.display = 'none'; // 다시 패스워드를 가릴 때 사선 지우기
                togglePasswordBtn.setAttribute('title', '비밀번호 보기');
            }
        });
    </script>
</body>
</html>
