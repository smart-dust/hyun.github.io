<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>로그인 | 대전대흥교회 청소년부</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0062ff;
            --primary-blue-dark: #004dc7;
            --text-dark: #1d1d1f;
            --text-gray: #86868b;
            --border-color: #e5e5ea;
            --bg-gray: #f5f5f7;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: var(--text-dark);
            display: flex; 
            align-items: center;
            justify-content: center;
            min-height: 100vh; 
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }

        .container { 
            width: 100%; 
            max-width: 350px; 
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header { text-align: center; margin-bottom: 35px; }
        header h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; color: var(--text-dark); }

        .login-form { display: flex; flex-direction: column; gap: 16px; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        
        .password-wrapper { position: relative; width: 100%; }
        
        label { font-size: 0.8rem; font-weight: 700; color: var(--text-dark); padding-left: 2px; }

        input {
            width: 100%; 
            padding: 15px; 
            border: 1px solid var(--border-color);
            border-radius: 12px; 
            font-size: 0.95rem; 
            background-color: var(--bg-gray);
            transition: var(--transition); 
            outline: none;
            -webkit-appearance: none;
        }
        
        input:focus { 
            border-color: var(--primary-blue); 
            background-color: #fff; 
            box-shadow: 0 0 0 4px rgba(0, 98, 255, 0.08); 
        }
        
        #password { padding-right: 50px; }

        .toggle-password {
            position: absolute; 
            right: 4px; 
            top: 50%; 
            transform: translateY(-50%);
            background: none; 
            border: none; 
            cursor: pointer;
            width: 44px;
            height: 44px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            user-select: none;
        }
        .toggle-password svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--text-gray);
            stroke-width: 1.75;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: var(--transition);
        }
        .toggle-password:hover svg { stroke: var(--text-dark); }

        .login-btn {
            width: 100%;
            padding: 15px; 
            background: var(--primary-blue);
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 0.95rem;
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 10px; 
            transition: var(--transition);
            -webkit-appearance: none;
        }
        .login-btn:active { 
            background: var(--primary-blue-dark);
            transform: scale(0.99); 
        }

        .nav-links { text-align: center; margin-top: 20px; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .nav-links a { color: var(--text-gray); text-decoration: none; font-size: 0.8rem; font-weight: 500; padding: 6px 10px; border-radius: 6px; transition: var(--transition); }
        .nav-links a:active { background-color: var(--bg-gray); }
        .divider { width: 1px; height: 10px; background-color: var(--border-color); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>대전대흥교회 청소년부</h1>
        </header>

        <div class="login-form">
            <div class="field">
                <label for="email">이메일 아이디</label>
                <input type="email" id="email" placeholder="example@email.com" required autocomplete="username" inputmode="email">
            </div>

            <div class="field">
                <label for="password">비밀번호</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="비밀번호 입력" required autocomplete="current-password">
                    <button type="button" id="toggle-password" class="toggle-password" title="비밀번호 보기">
                        <svg id="eye-icon" viewBox="0 0 24 24">
                            <path id="eye-path" d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"></path>
                            <circle id="eye-circle" cx="12" cy="12" r="3"></circle>
                            <line id="eye-slash" x1="4" y1="4" x2="20" y2="20" stroke-width="1.75" style="display:none;"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <button id="login-btn" class="login-btn">로그인</button>

            <div class="nav-links">
                <a href="signup.html">회원가입</a>
                <span class="divider"></span>
                <a href="index.html">홈으로 돌아가기</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAp8majwjPetRnK5u9f_agOWEcW2_veBdw",
            authDomain: "dhchurch-cf85f.firebaseapp.com",
            projectId: "dhchurch-cf85f",
            storageBucket: "dhchurch-cf85f.firebasestorage.app",
            messagingSenderId: "718998916531",
            appId: "1:718998916531:web:6d5641ed5a404c2ee0cfc6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if(!email || !password) {
                alert("아이디와 비밀번호를 모두 입력해주세요.");
                return;
            }

            try {
                await setPersistence(auth, browserSessionPersistence);
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                const userDocRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userDocRef);

                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    if (userData.role === 'admin') {
                        sessionStorage.setItem('isAdmin', 'true');
                        alert("관리자님, 환영합니다!");
                    } else {
                        sessionStorage.removeItem('isAdmin');
                        alert("로그인되었습니다.");
                    }
                } else {
                    sessionStorage.removeItem('isAdmin');
                    alert("로그인되었습니다.");
                }

                window.location.href = "index.html"; 
            } catch(e) {
                alert("로그인 실패: 이메일 또는 비밀번호를 확인해주세요.");
                console.error(e.message);
            }
        }

        document.getElementById('login-btn').addEventListener('click', handleLogin);

        document.getElementById('email').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
        document.getElementById('password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('toggle-password');
        const eyeIcon = document.getElementById('eye-icon');
        const eyeSlash = document.getElementById('eye-slash');

        togglePasswordBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeSlash.style.display = 'block';
                eyeIcon.style.stroke = 'var(--primary-blue)';
                togglePasswordBtn.setAttribute('title', '비밀번호 숨기기');
            } else {
                passwordInput.type = 'password';
                eyeSlash.style.display = 'none';
                eyeIcon.style.stroke = 'var(--text-gray)';
                togglePasswordBtn.setAttribute('title', '비밀번호 보기');
            }
        });
    </script>
</body>
</html>
